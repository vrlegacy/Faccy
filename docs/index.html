<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faccy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Faccy locks the Mac apps you choose behind your face, Touch ID, or a password.">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Faccy — your face, your apps">
<meta property="og:description" content="Lock the Mac apps you choose behind your face, Touch ID, or a password.">
<meta property="og:image" content="https://vrlegacy.github.io/Faccy/logo.png">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
/* Layout: Apple-style centered marketing page over drifting color fields; Liquid Glass panels; a Dynamic Island verifies the visitor, then becomes the nav. */
:root {
  --bg: #F5F5F7;
  --ink: #1D1D1F;
  --muted: #6E6E73;
  --link: #0071E3;
  --link-hover: #0077ED;
  --ok: #30D158;
  --island: #000000;
  --island-ink: #F5F5F7;
  --glass: rgba(255, 255, 255, 0.52);
  --glass-strong: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.85);
  --glass-edge: rgba(0, 0, 0, 0.06);
  --glass-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 -1px 0 rgba(255,255,255,.35) inset, 0 18px 40px rgba(30, 20, 80, 0.10);
  --blob-1: #B9A6FF;
  --blob-2: #FFB3E6;
  --blob-3: #9CCBFF;
  --wall-1: #C7B8FF;
  --wall-2: #FFC2EC;
  --wall-3: #EDEBF7;
  --term: #111114;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --ink: #F5F5F7; --muted: #A1A1A6; --link: #2997FF; --link-hover: #47A6FF; --ok: #30D158;
    --island: #000000; --island-ink: #F5F5F7;
    --glass: rgba(255, 255, 255, 0.07); --glass-strong: rgba(30, 30, 34, 0.72);
    --glass-border: rgba(255, 255, 255, 0.16); --glass-edge: rgba(255, 255, 255, 0.06);
    --glass-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 -1px 0 rgba(255,255,255,.05) inset, 0 18px 40px rgba(0,0,0,.45);
    --blob-1: #4B33D6; --blob-2: #9B1F8F; --blob-3: #1C4FB8;
    --wall-1: #2E2275; --wall-2: #4F1A50; --wall-3: #111018; --term: #0B0B0E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --ink: #F5F5F7; --muted: #A1A1A6; --link: #2997FF; --link-hover: #47A6FF; --ok: #30D158;
  --island: #000000; --island-ink: #F5F5F7;
  --glass: rgba(255, 255, 255, 0.07); --glass-strong: rgba(30, 30, 34, 0.72);
  --glass-border: rgba(255, 255, 255, 0.16); --glass-edge: rgba(255, 255, 255, 0.06);
  --glass-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 -1px 0 rgba(255,255,255,.05) inset, 0 18px 40px rgba(0,0,0,.45);
  --blob-1: #4B33D6; --blob-2: #9B1F8F; --blob-3: #1C4FB8;
  --wall-1: #2E2275; --wall-2: #4F1A50; --wall-3: #111018; --term: #0B0B0E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -0.022em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--link) 60%, transparent); outline-offset: 3px; border-radius: 10px; }

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* ---------- Ambient color fields behind the glass ---------- */
.fields { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.fields i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
.fields i:nth-child(1) { width: 60vmax; height: 60vmax; left: -18vmax; top: -22vmax; background: var(--blob-1); animation: drift1 26s ease-in-out infinite alternate; }
.fields i:nth-child(2) { width: 50vmax; height: 50vmax; right: -16vmax; top: 18vh; background: var(--blob-2); animation: drift2 30s ease-in-out infinite alternate; }
.fields i:nth-child(3) { width: 46vmax; height: 46vmax; left: 20vw; bottom: -26vmax; background: var(--blob-3); animation: drift3 34s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(10vw, 8vh) scale(1.08); } }
@keyframes drift2 { to { transform: translate(-8vw, 12vh) scale(.94); } }
@keyframes drift3 { to { transform: translate(-6vw, -10vh) scale(1.1); } }

/* ---------- Liquid Glass ---------- */
.glass {
  position: relative;
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), 0 0 0 1px var(--glass-edge);
  border-radius: 28px;
  overflow: hidden;
}
.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    radial-gradient(120% 60% at 10% -10%, rgba(255,255,255,.55), transparent 50%),
    linear-gradient(160deg, rgba(255,255,255,.18), transparent 40%);
  mix-blend-mode: soft-light;
}

/* ---------- Page entrance ---------- */
.page { position: relative; z-index: 1; transition: filter .9s ease, transform .9s cubic-bezier(.2,.8,.2,1), opacity .9s ease; }
.page.waiting { filter: blur(14px) saturate(120%); transform: scale(.965); opacity: .6; }

/* ---------- Gate overlay ---------- */
.gate { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 35%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: opacity .7s ease; display: grid; place-items: end center; padding-bottom: max(40px, env(safe-area-inset-bottom, 0px)); }
.gate.gone { opacity: 0; pointer-events: none; }
.gate .skip { font: 500 14px var(--font); color: var(--muted); background: var(--glass); border: 1px solid var(--glass-border); border-radius: 999px; padding: 8px 16px; cursor: pointer; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }

/* ---------- Dynamic Island ---------- */
.island-slot { position: fixed; z-index: 50; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.island {
  pointer-events: auto;
  background: var(--island);
  color: var(--island-ink);
  width: 126px; height: 37px; border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.06) inset;
  overflow: hidden; position: relative;
  transition: opacity .3s ease, width .55s cubic-bezier(.32,1.25,.5,1), height .55s cubic-bezier(.32,1.25,.5,1), border-radius .55s ease, transform .5s cubic-bezier(.32,1.4,.5,1);
  transform: scale(1);
}
.island.s-pre { opacity: 0; transform: scale(.4); }
.island.s-compact { transform: scale(1); }
.island.s-scan, .island.s-ok { width: min(372px, calc(100vw - 24px)); height: 84px; border-radius: 34px; transform: scale(1); }
.island.s-nav { width: min(680px, calc(100vw - 24px)); height: 48px; border-radius: 26px; transform: scale(1); }
.island .layer { position: absolute; inset: 0; display: flex; align-items: center; opacity: 0; transition: opacity .3s ease; pointer-events: none; }
.island .layer.on { opacity: 1; pointer-events: auto; transition-delay: .18s; }

.verify { padding: 0 20px 0 16px; gap: 14px; }
.scanner { width: 52px; height: 52px; flex: none; position: relative; color: #fff; }
.scanner svg { width: 100%; height: 100%; }
.scanner .ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; border-top-color: #7C6BFF; border-right-color: #E260D8; animation: spin 1s linear infinite; }
.s-ok .scanner .ring { display: none; }
.scanner .tick { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ok); opacity: 0; transform: scale(.6); transition: opacity .3s ease, transform .4s cubic-bezier(.3,1.6,.5,1); }
.s-ok .scanner .tick { opacity: 1; transform: none; }
.s-ok .scanner .glyph { opacity: 0; }
.scanner .glyph { transition: opacity .2s ease; }
.verify .vt { min-width: 0; }
.verify .v1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.verify .v2 { font-size: 13px; color: rgba(245,245,247,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes spin { to { transform: rotate(360deg); } }

.navbar { padding: 0 6px 0 14px; gap: 6px; justify-content: space-between; }
.navbar .brand { display: flex; align-items: center; gap: 8px; color: var(--island-ink); font-weight: 600; font-size: 15px; background: none; border: 0; cursor: pointer; font-family: var(--font); padding: 0; }
.navbar .brand:hover { text-decoration: none; }
.navbar .brand svg { width: 24px; height: 24px; }
.navbar nav { display: flex; align-items: center; gap: 2px; }
.navbar nav a { color: rgba(245,245,247,.78); font-size: 13px; padding: 7px 11px; border-radius: 999px; }
.navbar nav a:hover { color: #fff; background: rgba(255,255,255,.1); text-decoration: none; }
.navbar nav a.dl { background: #0071E3; color: #fff; font-weight: 500; margin-left: 4px; }
.navbar nav a.dl:hover { background: #0077ED; }
@media (max-width: 560px) { .navbar nav a.opt { display: none; } }

/* ---------- Buttons ---------- */
.btns { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 18px 28px; }
.btn-blue { display: inline-flex; align-items: center; background: #0071E3; color: #fff; font-size: 17px; padding: 12px 24px; border-radius: 980px; font-weight: 400; }
.btn-blue:hover { background: #0077ED; color: #fff; text-decoration: none; }
.chev::after { content: " ›"; }

/* ---------- Hero ---------- */
.hero { text-align: center; padding-block: 128px 40px; }
.kicker { font-size: 21px; font-weight: 600; letter-spacing: .004em; background: linear-gradient(90deg, #6E4BFF, #D23BC6); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; }
.hero h1 { font-size: clamp(48px, 10vw, 96px); line-height: 1.04; font-weight: 700; letter-spacing: -0.03em; margin: 10px 0 18px; text-wrap: balance; }
.hero .sub { font-size: clamp(19px, 2.4vw, 24px); line-height: 1.35; color: var(--muted); max-width: 30em; margin: 0 auto 30px; text-wrap: balance; font-weight: 500; letter-spacing: -0.01em; }
.hero .fine { margin-top: 16px; font-size: 13px; color: var(--muted); }

/* ---------- Product stage (Mac screen) ---------- */
.stage { margin: 56px auto 0; max-width: 900px; padding: 14px; border-radius: 34px; }
.screen { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%;
  background: radial-gradient(90% 80% at 10% 0%, var(--wall-1), transparent 60%), radial-gradient(80% 80% at 100% 100%, var(--wall-2), transparent 60%), var(--wall-3); }
.menubar { height: 28px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; font-size: 12px; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--bg) 40%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.menubar span { opacity: .78; }
.mini-island { position: absolute; top: 36px; left: 50%; transform: translateX(-50%); width: min(86%, 400px); background: #000; color: #F5F5F7; border-radius: 30px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 16px 36px rgba(0,0,0,.3); text-align: left; }
.mini-island .ai { width: 32px; height: 32px; border-radius: 9px; flex: none; background: conic-gradient(from 210deg, #ff6b6b, #ffd166, #06d6a0, #4cc9f0, #b388ff, #ff6b6b); display: grid; place-items: center; }
.mini-island .ai i { width: 11px; height: 11px; background: #fff; border-radius: 50%; }
.mini-island .mt { flex: 1; min-width: 0; }
.mini-island .m1 { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.mini-island .m2 { font-size: 11.5px; color: rgba(245,245,247,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-island .ib { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); flex: none; }
.mini-island .ib.on { background: rgba(255,255,255,.3); }
.mini-island .ib svg { width: 14px; height: 14px; }
.spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
.okc { width: 20px; height: 20px; color: var(--ok); flex: none; }
.appwin { position: absolute; left: 13%; right: 13%; top: 32%; bottom: 9%; border-radius: 14px; padding: 12px; opacity: 0; transform: translateY(16px) scale(.96); transition: opacity .5s ease, transform .5s cubic-bezier(.2,.9,.3,1.2); }
.appwin.show { opacity: 1; transform: none; }
.appwin .dots { display: flex; gap: 6px; margin-bottom: 10px; position: relative; }
.appwin .dots i { width: 10px; height: 10px; border-radius: 50%; }
.appwin .dots i:nth-child(1) { background: #FF5F57; } .appwin .dots i:nth-child(2) { background: #FEBC2E; } .appwin .dots i:nth-child(3) { background: #28C840; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; position: relative; }
.thumbs i { aspect-ratio: 1; border-radius: 7px; }
.lockedtag { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--ink); }
.lockedtag svg { width: 14px; height: 14px; position: relative; }
.lockedtag span { position: relative; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; margin-top: 22px; }
.seg button { position: relative; font: 500 14px var(--font); letter-spacing: -0.01em; color: var(--ink); background: transparent; border: 0; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); box-shadow: 0 2px 8px rgba(0,0,0,.12), 0 1px 0 rgba(255,255,255,.6) inset; }

/* ---------- Sections ---------- */
.section { padding-block: 110px 20px; text-align: center; }
.section h2 { font-size: clamp(36px, 6vw, 64px); line-height: 1.06; letter-spacing: -0.028em; font-weight: 700; margin: 0 0 16px; text-wrap: balance; }
.section .lead { font-size: clamp(19px, 2.2vw, 21px); color: var(--muted); max-width: 34em; margin: 0 auto 48px; text-wrap: balance; font-weight: 500; }
.grad { background: linear-gradient(90deg, #6E4BFF, #D23BC6 60%, #FF7A59); -webkit-background-clip: text; background-clip: text; color: transparent; }

.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; text-align: left; }
@media (max-width: 820px) { .trio { grid-template-columns: minmax(0, 1fr); } }
.tile { padding: 30px 28px 28px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tile > * { position: relative; }
.tile .ti { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; }
.tile .ti svg { width: 28px; height: 28px; }
.tile h3 { font-size: 24px; letter-spacing: -0.02em; margin: 8px 0 0; font-weight: 700; }
.tile p { margin: 0; color: var(--muted); font-size: 17px; }
.tile .spec { margin-top: auto; padding-top: 14px; font-size: 12px; color: var(--muted); font-family: var(--mono); letter-spacing: 0; }

/* Bento */
.bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; text-align: left; }
.b { padding: 28px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.b > * { position: relative; }
.b h3 { font-size: 22px; letter-spacing: -0.02em; margin: 0; font-weight: 700; }
.b p { margin: 0; color: var(--muted); font-size: 16px; }
.b .big { font-size: clamp(56px, 8vw, 84px); line-height: 1; font-weight: 700; letter-spacing: -0.04em; margin-bottom: 6px; }
.b-4 { grid-column: span 4; } .b-2 { grid-column: span 2; } .b-3 { grid-column: span 3; }
@media (max-width: 820px) { .bento { grid-template-columns: minmax(0, 1fr); } .b-4, .b-2, .b-3 { grid-column: auto; } }
.faces { display: flex; margin-top: 14px; }
.faces span { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--bg); margin-left: -10px; display: grid; place-items: center; font-weight: 600; font-size: 15px; color: #fff; }
.faces span:first-child { margin-left: 0; }
.times { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.times span { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.times span.sel { background: #0071E3; color: #fff; }
.lockrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.lockrow span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
.lockrow svg { width: 13px; height: 13px; }

/* Privacy */
.privacy { padding: 56px 40px; text-align: center; }
.privacy > * { position: relative; }
.privacy .shield { width: 64px; height: 64px; margin: 0 auto 18px; color: var(--ink); }
.privacy h2 { margin-bottom: 14px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 36px; }
@media (max-width: 720px) { .facts { grid-template-columns: minmax(0, 1fr); } .privacy { padding: 40px 22px; } }
.facts b { display: block; font-size: 19px; letter-spacing: -0.015em; margin-bottom: 4px; }
.facts span { color: var(--muted); font-size: 15px; }

/* Good to know */
.notes { text-align: left; padding: 10px 28px; max-width: 820px; margin: 0 auto; }
.note { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 20px; padding-block: 20px; position: relative; }
.note + .note { border-top: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); }
@media (max-width: 640px) { .note { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.note b { font-size: 17px; letter-spacing: -0.015em; }
.note span { color: var(--muted); font-size: 16px; }

/* Install */
.install { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; text-align: left; align-items: stretch; }
@media (max-width: 860px) { .install { grid-template-columns: minmax(0, 1fr); } }
.steps { padding: 30px 28px; display: flex; flex-direction: column; gap: 22px; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; position: relative; }
.step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 14px; font-weight: 600; }
.step h3 { margin: 3px 0 4px; font-size: 18px; letter-spacing: -0.015em; }
.step p { margin: 0; color: var(--muted); font-size: 15px; }
.term { background: var(--term); color: #EDEDF2; border-radius: 28px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.25); min-width: 0; border: 1px solid rgba(255,255,255,.08); }
.term-head { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 12px; color: rgba(255,255,255,.5); }
.term-head i { width: 12px; height: 12px; border-radius: 50%; }
.term-head i:nth-child(1) { background: #FF5F57; } .term-head i:nth-child(2) { background: #FEBC2E; } .term-head i:nth-child(3) { background: #28C840; }
.term-head span { margin-left: auto; margin-right: auto; padding-right: 52px; }
.cmd { display: flex; gap: 10px; align-items: flex-start; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,.05); }
.cmd:last-child { border-bottom: 0; }
.cmd .c { flex: 1; min-width: 0; font-family: var(--mono); font-size: 13px; line-height: 1.65; white-space: pre; overflow-x: auto; letter-spacing: 0; }
.cmd .c .p { color: #8E7CFF; user-select: none; }
.cmd .c .cm { color: rgba(255,255,255,.42); }
.copy { flex: none; font: 500 12px var(--font); color: #EDEDF2; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.copy:hover { background: rgba(255,255,255,.18); }

/* Closing CTA + footer */
.closing { padding-block: 120px 80px; text-align: center; }
.closing .mark { width: 96px; height: 96px; margin: 0 auto 22px; filter: drop-shadow(0 18px 30px rgba(80, 40, 200, .35)); }
.closing h2 { font-size: clamp(36px, 6vw, 60px); letter-spacing: -0.028em; line-height: 1.06; margin: 0 0 26px; font-weight: 700; }
footer { position: relative; z-index: 1; border-top: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); padding-block: 22px 40px; font-size: 12px; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 20px; }
footer button { font: inherit; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>
<div id="root">
  <noscript><p style="padding:24px">Faccy locks the Mac apps you choose behind your face, Touch ID, or a password. <a href="https://github.com/vrlegacy/Faccy">github.com/vrlegacy/Faccy</a></p></noscript>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const REPO = "https://github.com/vrlegacy/Faccy";
const RELEASES = "https://github.com/vrlegacy/Faccy/releases/latest";
const VERSION = "0.3.0";

/* ---------- Marks & glyphs ---------- */
function FaccyMark({ id = "fm" }) {
  return (
    <svg viewBox="100 100 824 824" aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor="#3B2BFF" />
          <stop offset="0.55" stopColor="#6A2BE8" />
          <stop offset="1" stopColor="#C02BB8" />
        </linearGradient>
      </defs>
      <rect x="100" y="100" width="824" height="824" rx="185" fill={`url(#${id})`} />
      <g fill="none" stroke="#fff" strokeOpacity="0.55" strokeWidth="26" strokeLinecap="round">
        <path d="M232 330 V262 Q232 232 262 232 H330" /><path d="M694 232 H762 Q792 232 792 262 V330" />
        <path d="M792 694 V762 Q792 792 762 792 H694" /><path d="M330 792 H262 Q232 792 232 762 V694" />
      </g>
      <path d="M392 470 V400 A120 120 0 0 1 632 400 V470" fill="none" stroke="#fff" strokeWidth="54" strokeLinecap="round" />
      <rect x="322" y="452" width="380" height="300" rx="78" fill="#fff" />
      <circle cx="440" cy="560" r="26" fill="#3B2BFF" />
      <path d="M558 562 Q584 584 610 562" fill="none" stroke="#3B2BFF" strokeWidth="20" strokeLinecap="round" />
      <path d="M448 646 Q512 694 576 646" fill="none" stroke="#6A2BE8" strokeWidth="22" strokeLinecap="round" />
    </svg>
  );
}

const G = {
  face: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9.5v1M15 9.5v1M12 10v3h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"/></svg>,
  touch: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M7.5 4.6A8 8 0 0 1 20 11v1M4 10a8 8 0 0 1 1.4-3.6M4 14v-2"/><path d="M8 18.5c.6-1.6 1-3.5 1-6.5a3 3 0 0 1 6 0c0 2-.2 3.8-.6 5.4"/><path d="M12 12c0 3-.6 5.8-1.8 8M17.4 16.5c.4-1.4.6-3 .6-4.5a6 6 0 0 0-9.6-4.8"/></svg>,
  key: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/></svg>,
  lock: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>,
  check: <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7Z"/></svg>,
  x: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>,
  shield: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"><path d="M12 2.8 4.5 5.8v6c0 4.6 3.2 8 7.5 9.4 4.3-1.4 7.5-4.8 7.5-9.4v-6L12 2.8Z"/><path d="m8.8 12 2.2 2.2 4.4-4.4"/></svg>,
  moon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>,
  clock: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>,
  user: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>,
};

/* Face ID-style scanner glyph for the island */
function ScanGlyph() {
  return (
    <svg className="glyph" viewBox="0 0 52 52" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round">
      <path d="M8 17V12a4 4 0 0 1 4-4h5M35 8h5a4 4 0 0 1 4 4v5M44 35v5a4 4 0 0 1-4 4h-5M17 44h-5a4 4 0 0 1-4-4v-5" />
      <path d="M19 21v3M33 21v3M26 22v7h-2M20.5 33.5a8 8 0 0 0 11 0" />
    </svg>
  );
}

/* ---------- Dynamic Island: gate, then nav ---------- */
const STAGES = [
  { s: "compact", ms: 450 },
  { s: "scan", ms: 1700 },
  { s: "ok", ms: 1150 },
  { s: "nav", ms: 0 },
];

function useIntro() {
  const reduced = useRef(typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  const [stage, setStage] = useState(reduced.current ? "nav" : "pre");
  const timers = useRef([]);

  const play = useCallback(() => {
    timers.current.forEach(clearTimeout);
    timers.current = [];
    if (reduced.current) { setStage("nav"); return; }
    setStage("pre");
    let t = 60;
    STAGES.forEach(({ s, ms }) => {
      timers.current.push(setTimeout(() => setStage(s), t));
      t += ms;
    });
  }, []);

  const skip = useCallback(() => {
    timers.current.forEach(clearTimeout);
    timers.current = [];
    setStage("nav");
  }, []);

  useEffect(() => { play(); return () => timers.current.forEach(clearTimeout); }, [play]);
  return { stage, play, skip };
}

function Island({ stage, onReplay }) {
  const cls = "s-" + stage;
  const verifying = stage === "scan" || stage === "ok";
  return (
    <div className="island-slot">
      <div className={"island " + cls} role="status" aria-live="polite">
        <div className={"layer verify" + (verifying ? " on" : "")} aria-hidden={!verifying}>
          <div className="scanner">
            <ScanGlyph />
            <span className="ring"></span>
            <span className="tick">{G.check}</span>
          </div>
          <div className="vt">
            <div className="v1">{stage === "ok" ? "Welcome in" : "Faccy"}</div>
            <div className="v2">{stage === "ok" ? "Verified. Enjoy the tour." : "Verifying it's you…"}</div>
          </div>
        </div>

        <div className={"layer navbar" + (stage === "nav" ? " on" : "")} aria-hidden={stage !== "nav"}>
          <button className="brand" onClick={onReplay} title="Replay the intro" tabIndex={stage === "nav" ? 0 : -1}>
            <FaccyMark id="fm-nav" /> Faccy
          </button>
          <nav aria-label="Main">
            <a className="opt" href="#unlock" tabIndex={stage === "nav" ? 0 : -1}>Unlock</a>
            <a className="opt" href="#features" tabIndex={stage === "nav" ? 0 : -1}>Features</a>
            <a className="opt" href="#privacy" tabIndex={stage === "nav" ? 0 : -1}>Privacy</a>
            <a className="opt" href="#install" tabIndex={stage === "nav" ? 0 : -1}>Install</a>
            <a className="dl" href={RELEASES} target="_blank" rel="noopener" tabIndex={stage === "nav" ? 0 : -1}>Download</a>
          </nav>
        </div>
      </div>
    </div>
  );
}

/* ---------- Product demo inside a Mac screen ---------- */
const SCRIPTS = {
  face: [
    { t: "Center your face to open Photos.", st: "scan", ms: 1500 },
    { t: "Match found — hold still.", st: "scan", ms: 800 },
    { t: "Verified — Vishwas.", st: "ok", ms: 2600 },
  ],
  touch: [
    { t: "Look at the camera, or touch the sensor.", st: "scan", ms: 1500, touch: true },
    { t: "Verified with Touch ID.", st: "ok", ms: 2600, touch: true },
  ],
  password: [
    { t: "Center your face to open Photos.", st: "scan", ms: 1200 },
    { t: "Enter a password…", st: "scan", ms: 1300, key: true },
    { t: "Verified with Partner.", st: "ok", ms: 2600, key: true },
  ],
};

function MacDemo({ running }) {
  const [mode, setMode] = useState("face");
  const [i, setI] = useState(0);
  useEffect(() => {
    if (!running) return;
    const steps = SCRIPTS[mode];
    const id = setTimeout(() => setI((i + 1) % steps.length), steps[Math.min(i, steps.length - 1)].ms);
    return () => clearTimeout(id);
  }, [mode, i, running]);

  const steps = SCRIPTS[mode];
  const step = steps[Math.min(i, steps.length - 1)];
  const ok = step.st === "ok";

  return (
    <div id="demo">
      <div className="stage glass">
        <div className="screen" role="img" aria-label={`Faccy prompt on a Mac: Open Photos. ${step.t}`}>
          <div className="menubar"><span>Finder&nbsp;&nbsp;&nbsp;File&nbsp;&nbsp;&nbsp;Edit&nbsp;&nbsp;&nbsp;View&nbsp;&nbsp;&nbsp;Go</span><span>Wed 4 Nov&nbsp;&nbsp;15:49</span></div>

          <div className={"appwin glass" + (ok ? " show" : "")} aria-hidden="true">
            <div className="dots"><i></i><i></i><i></i></div>
            <div className="thumbs">
              {["#F4A261","#2A9D8F","#E76F51","#8AB17D","#264653","#E9C46A","#B5838D","#6D6875"].map((c, k) => <i key={k} style={{ background: c }}></i>)}
            </div>
          </div>

          {!ok && <div className="lockedtag glass" aria-hidden="true">{G.lock}<span>Photos is locked</span></div>}

          <div className="mini-island">
            <div className="ai"><i></i></div>
            <div className="mt">
              <div className="m1">Open Photos</div>
              <div className="m2">{step.t}</div>
            </div>
            {ok ? <span className="okc">{G.check}</span> : <span className="spin" aria-hidden="true"></span>}
            {!ok && <span className={"ib" + (step.touch ? " on" : "")}>{G.touch}</span>}
            {!ok && <span className={"ib" + (step.key ? " on" : "")}>{G.key}</span>}
            {!ok && <span className="ib">{G.x}</span>}
          </div>
        </div>
      </div>

      <div className="seg glass" role="group" aria-label="Pick an unlock method for the demo">
        {[["face", "Face"], ["touch", "Touch ID"], ["password", "Password"]].map(([m, label]) => (
          <button key={m} id={"demo-" + m} aria-pressed={mode === m} onClick={() => { setMode(m); setI(0); }}>{label}</button>
        ))}
      </div>
    </div>
  );
}

/* ---------- Copyable command ---------- */
function Cmd({ text, comment }) {
  const [copied, setCopied] = useState(false);
  const ref = useRef(null);
  const select = () => {
    const r = document.createRange(); r.selectNodeContents(ref.current);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  const copy = () => {
    try {
      navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1600); }).catch(select);
    } catch (e) { select(); }
  };
  return (
    <div className="cmd">
      <div className="c">{comment && <span className="cm"># {comment}{"\n"}</span>}<span className="p">$ </span><span ref={ref}>{text}</span></div>
      <button className="copy" onClick={copy} aria-label={"Copy: " + text}>{copied ? "Copied" : "Copy"}</button>
    </div>
  );
}

/* ---------- Page ---------- */
function App() {
  const { stage, play, skip } = useIntro();
  const entered = stage === "nav";

  return (
    <>
      <div className="fields" aria-hidden="true"><i></i><i></i><i></i></div>

      <Island stage={stage} onReplay={play} />

      <div className={"gate" + (entered ? " gone" : "")} aria-hidden={entered}>
        <button className="skip" onClick={skip} tabIndex={entered ? -1 : 0}>Skip intro</button>
      </div>

      <div className={"page" + (entered ? "" : " waiting")}>
        <main>
          <section className="hero">
            <div className="wrap">
              <p className="kicker">Faccy for Mac</p>
              <h1>Your face.<br />Your apps.</h1>
              <p className="sub">Lock the apps you choose. Look at your Mac, touch the sensor or type a password, and they open. For you, and nobody else.</p>
              <div className="btns">
                <a className="btn-blue" href={RELEASES} target="_blank" rel="noopener">Download for Mac</a>
                <a className="chev" href="#demo">See it work</a>
              </div>
              <p className="fine">Free and open source · macOS 14 or later · Apple silicon · {VERSION}</p>
              <MacDemo running={entered} />
            </div>
          </section>

          <section className="section" id="unlock">
            <div className="wrap">
              <h2>Three ways in.<br /><span className="grad">The first one wins.</span></h2>
              <p className="lead">The face scan and Touch ID start at the same moment. Whichever recognizes you first opens the app, and the other quietly steps aside.</p>
              <div className="trio">
                <div className="tile glass">
                  <div className="ti" style={{ background: "linear-gradient(135deg,#6E4BFF,#A855F7)" }}>{G.face}</div>
                  <h3>Face</h3>
                  <p>Glance at the built-in camera. Two matching frames and you're in, usually in under a second.</p>
                  <div className="spec">Apple Vision · on-device</div>
                </div>
                <div className="tile glass">
                  <div className="ti" style={{ background: "linear-gradient(135deg,#FF375F,#FF7A59)" }}>{G.touch}</div>
                  <h3>Touch ID</h3>
                  <p>The fingerprint prompt appears alongside the face scan. Rest a finger on the key and skip the camera.</p>
                  <div className="spec">LocalAuthentication</div>
                </div>
                <div className="tile glass">
                  <div className="ti" style={{ background: "linear-gradient(135deg,#0A84FF,#30D1C4)" }}>{G.key}</div>
                  <h3>Password</h3>
                  <p>Tap the key in the prompt and type any of your saved passwords. Perfect when the camera is covered.</p>
                  <div className="spec">Salted SHA-256 · 60,000 rounds</div>
                </div>
              </div>
            </div>
          </section>

          <section className="section" id="features">
            <div className="wrap">
              <h2>Small app.<br /><span className="grad">Serious about your stuff.</span></h2>
              <p className="lead">Faccy lives in the menu bar, starts at login and watches for the apps you picked. Open one from the Dock, Spotlight or Finder, and it asks first.</p>
              <div className="bento">
                <div className="b b-4 glass">
                  <div className="big grad">5 faces.</div>
                  <h3>And 5 passwords.</h3>
                  <p>Enroll yourself, a partner or a colleague. Name each one. Any enrolled face, or any saved password, unlocks.</p>
                  <div className="faces" aria-hidden="true">
                    {[["V","#6E4BFF"],["P","#D23BC6"],["A","#FF7A59"],["K","#0A84FF"],["+","#8E8E93"]].map(([l, c]) => <span key={l} style={{ background: c }}>{l}</span>)}
                  </div>
                </div>
                <div className="b b-2 glass">
                  <h3>Locks itself again.</h3>
                  <p>Screen lock, sleep, switching users or 5 idle minutes relocks everything, including Faccy's own settings.</p>
                  <div className="lockrow">
                    <span>{G.lock} Screen lock</span><span>{G.moon} Sleep</span><span>{G.clock} Idle</span>
                  </div>
                </div>
                <div className="b b-3 glass">
                  <h3>An unlock per app.</h3>
                  <p>Ask every time, or remember an unlock for a while. Opening Photos never unlocks Messages.</p>
                  <div className="times" aria-hidden="true">
                    <span className="sel">Every launch</span><span>1 min</span><span>5 min</span><span>15 min</span><span>30 min</span>
                  </div>
                </div>
                <div className="b b-3 glass">
                  <h3>Built-in camera only.</h3>
                  <p>External, iPhone and virtual cameras are ignored, so nobody can pipe in a recorded video as the camera.</p>
                </div>
                <div className="b b-2 glass">
                  <h3>Stays out of the way.</h3>
                  <p>The prompt is a small island under the notch. The camera preview only appears if it needs your help.</p>
                </div>
                <div className="b b-4 glass">
                  <h3>Open source. MIT licensed.</h3>
                  <p>About 4,000 lines of Swift and SwiftUI. Read every line, build it with one double-click, or make it your own.</p>
                  <p style={{ marginTop: 6 }}><a className="chev" href={REPO} target="_blank" rel="noopener">View on GitHub</a></p>
                </div>
              </div>
            </div>
          </section>

          <section className="section" id="privacy">
            <div className="wrap">
              <div className="privacy glass">
                <div className="shield">{G.shield}</div>
                <h2>Privacy.<br />That's the whole point.</h2>
                <p className="lead" style={{ marginBottom: 0 }}>Recognition runs entirely on your Mac with Apple's Vision framework. No account. No cloud. No analytics.</p>
                <div className="facts">
                  <div><b>No photos stored.</b><span>Only face feature prints, kept in Application Support.</span></div>
                  <div><b>No network.</b><span>Faccy never sends your face, passwords or app list anywhere.</span></div>
                  <div><b>Your keys.</b><span>Passwords are salted and hashed, never saved as text.</span></div>
                </div>
              </div>
            </div>
          </section>

          <section className="section" id="good-to-know">
            <div className="wrap">
              <h2 style={{ fontSize: "clamp(30px,4.5vw,44px)" }}>Good to know.</h2>
              <p className="lead">Faccy runs as a normal app, so it has the limits of a normal app.</p>
              <div className="notes glass">
                <div className="note"><b>A watchdog, not a vault</b><span>Faccy stops a protected app the moment it starts. An app that's already open with windows can flash for a split second before it hides.</span></div>
                <div className="note"><b>Quitting Faccy turns it off</b><span>It guards against someone borrowing your unlocked Mac, not someone who knows to quit it.</span></div>
                <div className="note"><b>No liveness check</b><span>A photo of an enrolled face held up to the camera can pass. Prefer Touch ID if that matters to you.</span></div>
                <div className="note"><b>Locks the app, not its files</b><span>It's not FileVault. Data on disk stays readable to anyone with your user account.</span></div>
              </div>
            </div>
          </section>

          <section className="section" id="install">
            <div className="wrap">
              <h2>Up and running<br /><span className="grad">in about a minute.</span></h2>
              <p className="lead">Faccy isn't notarized by Apple yet, so macOS asks you to confirm it once.</p>
              <div className="install">
                <div className="steps glass">
                  <div className="step"><span className="n">1</span><div><h3>Download</h3><p>Get <a href={RELEASES} target="_blank" rel="noopener">Faccy-{VERSION}.dmg</a> and drag Faccy into Applications.</p></div></div>
                  <div className="step"><span className="n">2</span><div><h3>Allow it</h3><p>If macOS can't verify Faccy, click Done, then choose Open Anyway in System Settings › Privacy &amp; Security. Or run the first command.</p></div></div>
                  <div className="step"><span className="n">3</span><div><h3>Enroll and choose apps</h3><p>Allow the camera, scan your face, then pick the apps to lock. Add a password as a backup.</p></div></div>
                </div>
                <div className="term">
                  <div className="term-head"><i></i><i></i><i></i><span>Terminal</span></div>
                  <Cmd comment="let macOS open the downloaded app" text="xattr -dr com.apple.quarantine /Applications/Faccy.app" />
                  <Cmd comment="or build it yourself" text="git clone https://github.com/vrlegacy/Faccy.git" />
                  <Cmd text="cd Faccy && ./build.command" />
                </div>
              </div>
            </div>
          </section>

          <section className="closing">
            <div className="wrap">
              <div className="mark"><FaccyMark id="fm-close" /></div>
              <h2>Look. Unlock. Done.</h2>
              <div className="btns">
                <a className="btn-blue" href={RELEASES} target="_blank" rel="noopener">Download Faccy {VERSION}</a>
                <a className="chev" href={REPO} target="_blank" rel="noopener">Star it on GitHub</a>
              </div>
            </div>
          </section>
        </main>

        <footer>
          <div className="wrap">
            <span>Faccy is free and open source under the MIT license. Not affiliated with Apple. Face ID is a trademark of Apple Inc.</span>
            <span><button onClick={play}>Replay intro</button> · <a href="https://github.com/vrlegacy" target="_blank" rel="noopener">vrlegacy</a></span>
          </div>
        </footer>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

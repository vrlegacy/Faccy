<style>
/* Layout: left-aligned editorial column; the hero pairs the headline with a live "notch" demo on a mock Mac desktop. */
:root {
  --bg: #F4F3F8;
  --surface: #FFFFFF;
  --ink: #15131F;
  --muted: #5E5A72;
  --line: #DEDAEA;
  --accent: #5B3DF5;
  --accent-2: #B42BB0;
  --ok: #1E9E52;
  --warn: #B86A00;
  --pill: #0A0A0F;
  --pill-ink: #FFFFFF;
  --wall-1: #C9C0FF;
  --wall-2: #F1C6EE;
  --wall-3: #E9E6F5;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: clamp(2rem, 4vw, 2.6rem);
  --step-4: clamp(2.6rem, 7vw, 4.6rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0B12; --surface: #16141F; --ink: #F2F0FA; --muted: #A39FB8; --line: #2A2739;
    --accent: #8F7BFF; --accent-2: #E260D8; --ok: #3DDC84; --warn: #F2A93B;
    --pill: #000000; --pill-ink: #FFFFFF;
    --wall-1: #2B1F6B; --wall-2: #4A1A4C; --wall-3: #15131F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0B12; --surface: #16141F; --ink: #F2F0FA; --muted: #A39FB8; --line: #2A2739;
  --accent: #8F7BFF; --accent-2: #E260D8; --ok: #3DDC84; --warn: #F2A93B;
  --pill: #000000; --pill-ink: #FFFFFF;
  --wall-1: #2B1F6B; --wall-2: #4A1A4C; --wall-3: #15131F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.brand svg { width: 34px; height: 34px; }
.nav { display: flex; align-items: center; gap: 20px; font-size: var(--step--1); }
.nav a { color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--ink); }
.nav .gh { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { .nav .hide-sm { display: none; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: var(--step-0); padding: 12px 20px; border-radius: 999px; text-decoration: none; border: 1px solid transparent; cursor: pointer; font-family: var(--font-body); }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { background: var(--accent); color: #fff; }
.btn-ghost { border-color: var(--line); color: var(--ink); background: transparent; }
.btn-ghost:hover { border-color: var(--ink); }

/* Hero */
.hero { padding-block: 56px 72px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 48px; align-items: center; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: minmax(0, 1fr); gap: 36px; } }
.eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hero h1 { font-family: var(--font-display); font-size: var(--step-4); line-height: 1.02; letter-spacing: -0.035em; font-weight: 800; margin: 14px 0 18px; text-wrap: balance; }
.hero h1 em { font-style: normal; background: linear-gradient(100deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lede { font-size: var(--step-1); color: var(--muted); max-width: 34ch; margin: 0 0 28px; line-height: 1.5; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.meta { margin-top: 18px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }

/* Mock desktop + notch */
.desk { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 11; max-width: 100%;
  background: radial-gradient(120% 90% at 15% 10%, var(--wall-1), transparent 60%), radial-gradient(90% 80% at 95% 90%, var(--wall-2), transparent 60%), var(--wall-3); }
.menubar { height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--surface) 55%, transparent); backdrop-filter: blur(8px); }
.menubar span { opacity: .75; }
.pill-slot { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); width: min(88%, 420px); }
.pill { background: var(--pill); color: var(--pill-ink); border-radius: 26px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 14px 30px rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.08); transition: border-radius .3s ease; }
.pill .app-ic { width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center; background: conic-gradient(from 200deg, #ff5f6d, #ffc371, #7bd88f, #4fc3f7, #b388ff, #ff5f6d); }
.pill .app-ic i { width: 12px; height: 12px; background: #fff; border-radius: 50%; opacity: .9; }
.pill .txt { min-width: 0; flex: 1; }
.pill .t1 { font-size: 13px; font-weight: 600; line-height: 1.2; }
.pill .t2 { font-size: 11px; opacity: .62; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill .ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); flex: none; }
.pill .ico svg { width: 14px; height: 14px; }
.pill .ico.on { background: rgba(255,255,255,.28); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite; flex: none; }
.check { width: 18px; height: 18px; flex: none; color: #3DDC84; }
@keyframes spin { to { transform: rotate(360deg); } }
.window { position: absolute; left: 12%; right: 12%; top: 34%; bottom: 10%; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(20, 10, 60, .22); padding: 12px; transform: translateY(14px) scale(.97); opacity: 0; transition: opacity .45s ease, transform .45s ease; }
.window.show { opacity: 1; transform: none; }
.window .dots { display: flex; gap: 6px; margin-bottom: 10px; }
.window .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.thumbs i { aspect-ratio: 1; border-radius: 6px; }
.locked-note { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 8px 14px; border-radius: 999px; transition: opacity .3s; }
.locked-note svg { width: 14px; height: 14px; }
.demo-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.demo-controls .lbl { font-size: var(--step--1); color: var(--muted); margin-right: 4px; }
.chip { font: 500 0.85rem var(--font-body); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Sections */
section.block { padding-block: 72px; border-top: 1px solid var(--line); }
.sec-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 40px; margin-bottom: 40px; align-items: end; }
@media (max-width: 800px) { .sec-head { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
.sec-head h2 { font-family: var(--font-display); font-size: var(--step-3); line-height: 1.08; letter-spacing: -0.025em; margin: 8px 0 0; text-wrap: balance; }
.sec-head p { color: var(--muted); margin: 0; max-width: 60ch; }

/* Unlock methods */
.methods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
@media (max-width: 800px) { .methods { grid-template-columns: minmax(0, 1fr); } }
.method { padding: 28px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.method + .method { border-left: 1px solid var(--line); }
@media (max-width: 800px) { .method + .method { border-left: 0; border-top: 1px solid var(--line); } }
.method .mi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.method .mi svg { width: 22px; height: 22px; }
.method h3 { font-family: var(--font-display); font-size: var(--step-1); margin: 6px 0 0; letter-spacing: -0.01em; }
.method p { margin: 0; color: var(--muted); }
.method .spec { margin-top: auto; padding-top: 10px; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.race { margin-top: 20px; display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: var(--step--1); max-width: 70ch; }
.race b { color: var(--ink); }

/* Feature list */
.features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 48px; }
@media (max-width: 760px) { .features { grid-template-columns: minmax(0, 1fr); } }
.feat { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.feat svg { width: 22px; height: 22px; color: var(--accent); margin-top: 3px; }
.feat h3 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 600; }
.feat p { margin: 0; color: var(--muted); font-size: 0.95rem; }

/* Honest limits */
.limits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .limits { grid-template-columns: minmax(0, 1fr); } }
.limit { padding: 18px 20px; border-radius: 12px; border: 1px dashed var(--line); min-width: 0; }
.limit h3 { margin: 0 0 6px; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.limit h3 svg { width: 16px; height: 16px; color: var(--warn); flex: none; }
.limit p { margin: 0; color: var(--muted); font-size: 0.93rem; }

/* Install */
.install { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 860px) { .install { grid-template-columns: minmax(0, 1fr); } }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; counter-increment: s; }
.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
.steps h3 { margin: 2px 0 4px; font-size: 1.02rem; font-weight: 600; }
.steps p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.term { background: var(--pill); color: #E9E6F7; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); min-width: 0; }
.term-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); font-family: var(--font-mono); font-size: 0.75rem; color: rgba(255,255,255,.55); }
.term-head .dots { display: flex; gap: 6px; }
.term-head .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.18); }
.cmd { display: flex; align-items: flex-start; gap: 10px; padding: 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
.cmd:last-child { border-bottom: 0; }
.cmd .c { font-family: var(--font-mono); font-size: 0.82rem; white-space: pre; overflow-x: auto; flex: 1; min-width: 0; line-height: 1.6; }
.cmd .c .p { color: #8F7BFF; user-select: none; }
.cmd .c .cm { color: rgba(255,255,255,.45); }
.copy { flex: none; font: 500 0.75rem var(--font-body); color: #E9E6F7; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.copy:hover { background: rgba(255,255,255,.16); }

/* Footer */
footer { border-top: 1px solid var(--line); padding-block: 40px 48px; color: var(--muted); font-size: var(--step--1); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; }
footer .brand { font-size: 1rem; }
footer .brand svg { width: 26px; height: 26px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

function NotchDemo() {
  const [mode, setMode] = useState("face");
  const [i, setI] = useState(0);
  const reduced = useRef(false);

  useEffect(() => {
    reduced.current = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }, []);

  useEffect(() => {
    const script = SCRIPTS[mode];
    if (reduced.current) { setI(script.length - 1); return; }
    const step = script[i];
    const id = setTimeout(() => setI((i + 1) % script.length), step.ms);
    return () => clearTimeout(id);
  }, [mode, i]);

  const step = SCRIPTS[mode][Math.min(i, SCRIPTS[mode].length - 1)];
  const ok = step.state === "ok";

  const pick = (m) => { setMode(m); setI(0); };

  return (
    <div>
      <div className="desk" role="img" aria-label={`Faccy prompt: ${step.t1}. ${step.t2}`}>
        <div className="menubar"><span>Finder&nbsp;&nbsp;File&nbsp;&nbsp;Edit&nbsp;&nbsp;View</span><span>Wed 15:49</span></div>

        <div className={"window" + (ok ? " show" : "")} aria-hidden="true">
          <div className="dots"><i></i><i></i><i></i></div>
          <div className="thumbs">
            {["#F4A261","#2A9D8F","#E76F51","#8AB17D","#264653","#E9C46A","#B5838D","#6D6875"].map((c, k) => (
              <i key={k} style={{ background: c }}></i>
            ))}
          </div>
        </div>

        {!ok && (
          <div className="locked-note" aria-hidden="true">{Icon.lock} Photos is locked</div>
        )}

        <div className="pill-slot">
          <div className="pill">
            <div className="app-ic"><i></i></div>
            <div className="txt">
              <div className="t1">{step.t1}</div>
              <div className="t2">{step.t2}</div>
            </div>
            {ok ? <span className="check">{Icon.check}</span> : <span className="spinner" aria-hidden="true"></span>}
            {!ok && <span className={"ico" + (step.touch ? " on" : "")}>{Icon.touch}</span>}
            {!ok && <span className={"ico" + (step.key ? " on" : "")}>{Icon.key}</span>}
            {!ok && <span className="ico">{Icon.x}</span>}
          </div>
        </div>
      </div>

      <div className="demo-controls" role="group" aria-label="Choose an unlock method for the demo">
        <span className="lbl">Try it with</span>
        {[["face", "Face"], ["touch", "Touch ID"], ["password", "Password"]].map(([m, label]) => (
          <button key={m} id={"demo-" + m} className="chip" aria-pressed={mode === m} onClick={() => pick(m)}>{label}</button>
        ))}
      </div>
    </div>
  );
}

/* ---------- Copyable command ---------- */
function Cmd({ text, comment }) {
  const [copied, setCopied] = useState(false);
  const ref = useRef(null);
  const copy = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1600); };
    try {
      navigator.clipboard.writeText(text).then(done).catch(selectText);
    } catch (e) { selectText(); }
  };
  const selectText = () => {
    const range = document.createRange();
    range.selectNodeContents(ref.current);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  };
  return (
    <div className="cmd">
      <div className="c">
        {comment && <span className="cm"># {comment}{"\n"}</span>}
        <span className="p">$ </span><span ref={ref}>{text}</span>
      </div>
      <button className="copy" onClick={copy} aria-label={"Copy: " + text}>{copied ? "Copied" : "Copy"}</button>
    </div>
  );
}

name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build app bundle
        run: ./scripts/build.sh release
      - name: Upload Faccy.app
        uses: actions/upload-artifact@v4
        with:
          name: Faccy.app
          path: dist/Faccy.app

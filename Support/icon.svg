<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2BFF"/>
      <stop offset="0.55" stop-color="#6A2BE8"/>
      <stop offset="1" stop-color="#C02BB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E1FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a0b5c" flood-opacity="0.45"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- macOS squircle tile -->
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  </g>

  <!-- scan corners -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="26" stroke-linecap="round">
    <path d="M232 330 V262 Q232 232 262 232 H330"/>
    <path d="M694 232 H762 Q792 232 792 262 V330"/>
    <path d="M792 694 V762 Q792 792 762 792 H694"/>
    <path d="M330 792 H262 Q232 792 232 762 V694"/>
  </g>

  <g filter="url(#shadow)">
    <!-- shackle -->
    <path d="M392 470 V400 A120 120 0 0 1 632 400 V470"
          fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="round"/>
    <!-- lock body = face -->
    <rect x="322" y="452" width="380" height="300" rx="78" fill="url(#body)"/>
  </g>

  <!-- face: open eye + blinking eye + smile -->
  <circle cx="440" cy="560" r="26" fill="#3B2BFF"/>
  <path d="M558 562 Q584 584 610 562" fill="none" stroke="#3B2BFF" stroke-width="20" stroke-linecap="round"/>
  <path d="M448 646 Q512 694 576 646" fill="none" stroke="#6A2BE8" stroke-width="22" stroke-linecap="round"/>
</svg>
